<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Para ti, con todo mi ❤️</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:#000;overflow:hidden;color:#fff;transition:background .45s ease}
.card{width:min(92vw,430px);padding:34px 24px;text-align:center}
.heart{font-size:100px;line-height:1;cursor:pointer;user-select:none;transition:transform .18s}
.heart:active{transform:scale(1.18)}
.bar{height:20px;border-radius:20px;background:rgba(255,255,255,.3);overflow:hidden;margin:24px 0 10px}
.fill{height:100%;width:0;background:linear-gradient(90deg,#fff,#ffd1f2);transition:width .5s}
.counter{font-size:14px;color:#fff}
.msg{min-height:76px;margin-top:20px;font-size:20px;font-weight:600;color:#fff}
.hidden{display:none}
#again{border:0;border-radius:20px;padding:10px 18px;background:rgba(255,255,255,.8);color:#333}
.particle{position:fixed;pointer-events:none;font-size:24px;animation:fall 2.4s ease-out forwards}
@keyframes fall{0%{transform:translateY(0) scale(.7);opacity:0}15%{opacity:1}100%{transform:translateY(75vh) rotate(360deg) scale(1.2);opacity:0}}
</style>
</head>
<body>
<main class="card">
<div class="heart" id="heart" role="button" tabindex="0" aria-label="Toca el corazón">❤️</div>
<div class="bar"><div class="fill" id="fill"></div></div>
<div class="counter" id="counter">0 de 3</div>
<div class="msg" id="msg">Toca el corazón ❤️</div>
<button id="again" class="hidden">Volver a empezar</button>
</main>
<script>
const heart=document.getElementById('heart'),fill=document.getElementById('fill'),
counter=document.getElementById('counter'),msg=document.getElementById('msg'),
again=document.getElementById('again');let n=0;
function confetti(){
 const items=['❤️','💕','🌈','💖','💗','💜','💙','💛','👩🏻‍⚖️','🙋🏽'];
 for(let i=0;i<35;i++){const p=document.createElement('span');p.className='particle';
 p.textContent=items[Math.floor(Math.random()*items.length)];
 p.style.left=(Math.random()*100)+'vw';p.style.top=(Math.random()*30)+'vh';
 p.style.animationDelay=(Math.random()*.7)+'s';document.body.appendChild(p);
 setTimeout(()=>p.remove(),3200);}
}
function tap(){
 if(n>=3)return;n++;
 fill.style.width=(n*33.333)+'%';counter.textContent=n+' de 3';
 if(n===1){document.body.style.background='#00ffff';msg.textContent='Una vez más... ❤️'}
 if(n===2){document.body.style.background='#00ff00';msg.textContent='Ya casi... 💗'}
 if(n===3){document.body.style.background='#ff00ff';
 msg.textContent='¡Que tu día esté lleno de colores 🌈. Te amo mucho Abogadita!';
 heart.textContent='💖';again.classList.remove('hidden');confetti();}
}
function reset(){n=0;document.body.style.background='#000000';fill.style.width='0';counter.textContent='0 de 3';
msg.textContent='¡Hola Beibicita Guapa!<br>Toca el corazón 👆🏽';heart.textContent='❤️';again.classList.add('hidden')}
heart.addEventListener('click',tap);
heart.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();tap()}});
again.addEventListener('click',reset);
</script>
</body>
</html>
